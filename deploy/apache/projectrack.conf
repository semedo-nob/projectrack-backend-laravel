# Apache 2.4 virtual host for the ProjectRack Laravel app.
# Install:
#   sudo cp deploy/apache/projectrack.conf /etc/apache2/sites-available/projectrack.conf
#   sudo a2enmod rewrite headers ssl proxy proxy_fcgi setenvif
#   sudo a2ensite projectrack
#   sudo a2dissite 000-default
# Replace YOUR_DNS_NAME before enabling the site.
#
# Document root is public/. The .env file, storage, and vendor stay outside it.

<VirtualHost *:80>
    ServerName YOUR_DNS_NAME
    ServerSignature Off

    DocumentRoot /var/www/projectrack/public

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://YOUR_DNS_NAME%{REQUEST_URI} [END,R=301]

    ErrorLog ${APACHE_LOG_DIR}/projectrack.error.log
</VirtualHost>

<VirtualHost *:443>
    ServerName YOUR_DNS_NAME
    ServerSignature Off

    DocumentRoot /var/www/projectrack/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/YOUR_DNS_NAME/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/YOUR_DNS_NAME/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    Header always set Strict-Transport-Security "max-age=15552000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"
    Header always unset X-Powered-By

    LimitRequestBody 16777216
    Timeout 120
    ProxyTimeout 120

    # Share tokens and bearer material stay out of the access log.
    SetEnvIf Request_URI "^/p/" nolog
    SetEnvIf Request_URI "^/api/v1/shares/" nolog
    SetEnvIf Request_URI "^/up$" nolog
    CustomLog ${APACHE_LOG_DIR}/projectrack.access.log combined env=!nolog
    ErrorLog ${APACHE_LOG_DIR}/projectrack.error.log

    <Directory /var/www/projectrack/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        CGIPassAuth On

        RewriteEngine On

        # Sanctum reads the bearer token from this header.
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        RewriteCond %{HTTP:x-xsrf-token} .
        RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <Directory /var/www/projectrack>
        Require all denied
    </Directory>

    <Directory /var/www/projectrack/public>
        Require all granted
    </Directory>

    # Refuse hidden files such as a misplaced .env.
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-projectrack.sock|fcgi://localhost"
    </FilesMatch>

    # Authenticated API and share pages must not be stored by a shared cache.
    <LocationMatch "^/(api|p)/">
        Header always set Cache-Control "private, no-store"
    </LocationMatch>

    ErrorDocument 502 "ProjectRack is temporarily unavailable."
    ErrorDocument 503 "ProjectRack is temporarily unavailable."
</VirtualHost>
