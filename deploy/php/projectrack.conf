; PHP-FPM pool. Copy to /etc/php/8.4/fpm/pool.d/projectrack.conf
; Disable the default www pool if this host only serves ProjectRack,
; or leave www in place and use this socket from the Apache site.
[projectrack]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-projectrack.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
chdir = /var/www/projectrack
php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M
php_admin_value[max_execution_time] = 120
