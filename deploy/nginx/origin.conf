worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 16m;

    map $request_uri $projectrack_log_uri {
        ~*^/p/[^?\s]+                 /p/[redacted];
        ~*^/api/v1/shares/[^?\s]+     /api/v1/shares/[redacted];
        default                       $uri;
    }

    log_format projectrack '$remote_addr [$time_local] "$request_method $projectrack_log_uri $server_protocol" '
                           '$status $body_bytes_sent';

    # Cloudflare Tunnel connects from this host. Prefer the edge client IP
    # only when cloudflared set it. Direct local curls keep the loopback address.
    map $http_cf_connecting_ip $projectrack_forwarded_for {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    map $http_cf_connecting_ip $projectrack_forwarded_proto {
        ""      $scheme;
        default https;
    }

    limit_req_zone $projectrack_forwarded_for zone=projectrack_api:10m rate=10r/s;
    limit_req_zone $projectrack_forwarded_for zone=projectrack_auth:10m rate=5r/m;
    limit_req_zone $projectrack_forwarded_for zone=projectrack_share:10m rate=30r/m;

    upstream projectrack_backend {
        server 127.0.0.1:8000;
        keepalive 4;
    }

    server {
        listen 127.0.0.1:8080;
        server_name _;

        access_log /var/log/nginx/access.log projectrack;

        error_page 502 503 504 @unavailable;

        location @unavailable {
            default_type text/plain;
            return 502 "ProjectRack is temporarily unavailable.\n";
        }

        location = /up {
            proxy_pass http://projectrack_backend;
            include /etc/nginx/projectrack-proxy.conf;
            access_log off;
        }

        location ^~ /api/v1/auth/ {
            limit_req zone=projectrack_auth burst=5 nodelay;
            proxy_pass http://projectrack_backend;
            include /etc/nginx/projectrack-proxy.conf;
            add_header Cache-Control "private, no-store" always;
        }

        location ^~ /api/ {
            limit_req zone=projectrack_api burst=20 nodelay;
            proxy_pass http://projectrack_backend;
            include /etc/nginx/projectrack-proxy.conf;
            add_header Cache-Control "private, no-store" always;
        }

        location ^~ /p/ {
            limit_req zone=projectrack_share burst=10 nodelay;
            proxy_pass http://projectrack_backend;
            include /etc/nginx/projectrack-proxy.conf;
            add_header Cache-Control "private, no-store" always;
        }

        location / {
            proxy_pass http://projectrack_backend;
            include /etc/nginx/projectrack-proxy.conf;
            add_header Cache-Control "private, no-store" always;
        }
    }
}
