proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $projectrack_forwarded_for;
proxy_set_header X-Forwarded-For $projectrack_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $projectrack_forwarded_proto;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
proxy_hide_header X-Powered-By;
proxy_redirect off;
proxy_buffering off;
proxy_cache off;
