services:
  db:
    image: postgres:16-alpine
    container_name: projectrack-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectrack
      POSTGRES_PASSWORD: projectrack
      POSTGRES_DB: projectrack
    # 5434 on this machine is another application's database, published on
    # every interface. ProjectRack listens on localhost only.
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - projectrack_pg:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27-alpine
    container_name: projectrack-nginx
    network_mode: host
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./deploy/nginx/origin.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/projectrack-proxy.conf:/etc/nginx/projectrack-proxy.conf:ro

volumes:
  projectrack_pg:
